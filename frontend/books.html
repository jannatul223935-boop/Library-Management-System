<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Books</title>

    <link rel="stylesheet"
        href="css/style.css">

</head>


<body>


    <nav>

        <h2>📚 Library Management</h2>

        <div>

            <a href="index.html">
                Home
            </a>

            <a href="login.html">
                Logout
            </a>

        </div>

    </nav>


    <!-- =========================
         AVAILABLE BOOKS
    ========================== -->

    <div class="form-container"
        id="availableBooksSection">

        <h2>
            Available Books
        </h2>


        <table border="1"
            width="100%"
            cellpadding="10">

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Title</th>

                    <th>Author</th>

                    <th>Category</th>

                    <th>Quantity</th>

                    <th>Action</th>

                </tr>

            </thead>


            <tbody id="bookTable">

            </tbody>

        </table>

    </div>



    <!-- =========================
         MY BORROWED BOOKS
    ========================== -->

    <div class="form-container"
        id="borrowedBooksSection">

        <h2>
            📖 My Borrowed Books
        </h2>


        <table border="1"
            width="100%"
            cellpadding="10">

            <thead>

                <tr>

                    <th>Borrow ID</th>

                    <th>Title</th>

                    <th>Author</th>

                    <th>Borrow Date</th>

                    <th>Status</th>

                    <th>Action</th>

                </tr>

            </thead>


            <tbody id="borrowedBookTable">

            </tbody>

        </table>

    </div>



    <script src="js/script.js"></script>

</body>

</html>
